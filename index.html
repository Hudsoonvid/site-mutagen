<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f5f1">
  <title>Mutagen — a little something, every day</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #20231f;
      background: #f6f5f1;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 2rem;
    }

    main {
      width: min(100%, 42rem);
      padding: clamp(2rem, 8vw, 5rem);
      border: 1px solid #deded5;
      border-radius: 1.5rem;
      background: #fffefa;
      box-shadow: 0 1.5rem 4rem rgb(32 35 31 / 7%);
    }

    .eyebrow {
      margin: 0 0 1.25rem;
      color: #64715e;
      font-size: .78rem;
      font-weight: 700;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    h1 {
      max-width: 10ch;
      margin: 0;
      font-size: clamp(3rem, 10vw, 5.5rem);
      letter-spacing: -.075em;
      line-height: .98;
    }

    .intro {
      max-width: 34rem;
      margin: 1.5rem 0 2rem;
      color: #5b6058;
      font-size: clamp(1.05rem, 3vw, 1.25rem);
      line-height: 1.7;
    }

    .request-link {
      display: inline-flex;
      align-items: center;
      gap: .65rem;
      min-height: 3.25rem;
      padding: .8rem 1.15rem;
      border-radius: .65rem;
      background: #344b36;
      color: white;
      font-weight: 650;
      text-decoration: none;
      transition: background-color .2s ease, transform .2s ease;
    }

    .request-link:hover { background: #263b29; transform: translateY(-2px); }
    .request-link:focus-visible { outline: 3px solid #91aa7f; outline-offset: 4px; }
    .arrow { font-size: 1.2em; }


    .additions { margin: 2.5rem 0 0; padding: 0; list-style: none; border-top: 1px solid #deded5; }
    .additions:empty { display: none; }
    .addition { padding: 1.1rem 0; border-bottom: 1px solid #deded5; }
    .addition-text { margin: 0; font-size: 1.1rem; line-height: 1.5; overflow-wrap: anywhere; }
    .requested-by { position: relative; display: inline-block; margin-top: .35rem; color: #858980; font-size: .85rem; cursor: help; }
    .requested-by:focus-visible { outline: 3px solid #91aa7f; outline-offset: 3px; border-radius: .25rem; }
    .requested-by::after {
      content: attr(data-name);
      position: absolute; left: 0; bottom: calc(100% + .4rem);
      padding: .35rem .65rem; border-radius: .5rem;
      background: #344b36; color: #fff; font-size: .8rem; font-weight: 650; white-space: nowrap;
      opacity: 0; pointer-events: none; transform: translateY(4px);
      transition: opacity .15s ease, transform .15s ease;
    }
    .requested-by:hover::after, .requested-by:focus::after { opacity: 1; transform: none; }

    footer {
      margin-top: 3rem;
      color: #858980;
      font-size: .85rem;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">A small thing, refreshed daily</p>
    <h1>Welcome to Mutagen.</h1>
    <p class="intro">Something new is taking shape here. Have an idea for what we should add next? Send in a request and help us make this site a little better every day.</p>
    <a class="request-link" href="https://forms.gle/joeZed9KM3tsd2Td8" target="_blank" rel="noopener noreferrer">
      Request a new addition <span class="arrow" aria-hidden="true">↗</span>
    </a>
    <ul class="additions" id="additions" aria-label="Additions"></ul>
    <footer>Made to grow, one day at a time.</footer>
  </main>
  <script>
    fetch('additions.json', { cache: 'no-cache' })
      .then(function (r) { return r.json(); })
      .then(function (items) {
        var list = document.getElementById('additions');
        items.slice().reverse().forEach(function (it) {
          var li = document.createElement('li'); li.className = 'addition';
          var p = document.createElement('p'); p.className = 'addition-text'; p.textContent = it.text;
          var by = document.createElement('span'); by.className = 'requested-by'; by.tabIndex = 0;
          by.setAttribute('data-name', it.requestedBy);
          by.textContent = 'requested by ' + it.requestedBy;
          li.appendChild(p); li.appendChild(by); list.appendChild(li);
        });
      })
      .catch(function () {});
  </script>
</body>
</html>
