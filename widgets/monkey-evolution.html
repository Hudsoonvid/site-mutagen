<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
html,body{margin:0;height:100%;background:#f5f0e1;color:#2f4a2a;font-family:Georgia,serif}
#w{display:flex;flex-direction:column;height:100%;box-sizing:border-box;padding:.5rem;gap:.4rem}
h1{margin:0;font-size:clamp(.8rem,3vmin,1.2rem);color:#4a6b3a}
#tree{flex:1;min-height:0;display:flex;flex-direction:column;gap:.25rem;overflow:auto}
.n{display:flex;align-items:center;gap:.4rem;border:0;text-align:left;background:#e8e2cc;color:#2f4a2a;border-radius:.4rem;padding:.25rem .5rem;font:inherit;font-size:clamp(.7rem,2.4vmin,1rem);cursor:pointer;border-left:.35rem solid #4a6b3a}
.n small{margin-left:auto;opacity:.7;white-space:nowrap}
.n.on{background:#4a6b3a;color:#f5f0e1}
.d1{margin-left:1rem}.d2{margin-left:2rem}
#info{font-size:clamp(.7rem,2.2vmin,.95rem);line-height:1.25;min-height:3.6em;background:#fffaf0;border-radius:.4rem;padding:.3rem .5rem}
</style></head><body>
<div id="w">
<h1>Primate family tree - tap a branch</h1>
<div id="tree"></div>
<div id="info"></div>
</div>
<script>
const N=[
[0,"First primates","65 mya","Small tree-dwelling mammals such as Purgatorius lived among dinosaur survivors. They are the root of all primates."],
[1,"Prosimians","55 mya","Lemurs, lorises and tarsiers. Big eyes and grasping hands, they branched off first."],
[1,"Simians","40 mya","The group with better vision and bigger brains: monkeys, apes and humans."],
[2,"New World monkeys","35 mya","Rafted to South America on floating vegetation. Many have prehensile tails to grab branches."],
[2,"Old World monkeys","25 mya","Africa and Asia: baboons, macaques, colobus. No grasping tails."],
[2,"Apes","20 mya","Tailless and larger-bodied: gibbons, orangutans, gorillas, chimps and humans."],
[2,"Human line","7 mya","Our line split from chimpanzees. Monkeys are distant cousins, not our ancestors."]];
const t=document.getElementById('tree'),info=document.getElementById('info');
function sel(i){[...t.children].forEach((b,j)=>b.classList.toggle('on',i===j));info.innerHTML='<b>'+N[i][1]+'</b> ('+N[i][2]+'): '+N[i][3]}
N.forEach((n,i)=>{const b=document.createElement('button');b.className='n d'+n[0];b.innerHTML=n[1]+'<small>'+n[2]+'</small>';b.onclick=()=>sel(i);t.appendChild(b)});
sel(0);
</script></body></html>
