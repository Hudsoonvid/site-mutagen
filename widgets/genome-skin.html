<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
html,body{margin:0;height:100%;background:#f4efdc;color:#2f4a1c;font-family:system-ui,sans-serif;overflow:hidden}
#w{position:relative;display:flex;flex-direction:column;gap:6px;height:100%;box-sizing:border-box;padding:7px}
#bases{display:flex;flex-wrap:wrap;align-items:center;gap:5px}
button{font:inherit;font-size:12px;font-weight:650;min-height:28px;padding:3px 9px;border:1px solid #5b7a3a;border-radius:6px;background:#e6efd0;color:#2f4a1c;cursor:pointer}
button:hover{background:#d6e4b6}
button:focus-visible{outline:2px solid #2f4a1c;outline-offset:1px}
button:disabled{opacity:.45;cursor:default}
.b{width:32px;padding:3px 0;color:#fff;border-color:transparent}
.A,.A:hover{background:#3f7d9c}.T,.T:hover{background:#b0822e}.G,.G:hover{background:#4d8a4a}.C,.C:hover{background:#b0507a}
#done{margin-left:auto;background:#2d5233;color:#fff;border-color:#2d5233}
#strand{flex:1;min-height:0;overflow:auto;display:flex;flex-wrap:wrap;align-content:flex-start;gap:3px;padding:6px;background:#fffdf3;border:2px solid #5b7a3a;border-radius:8px}
.t{display:flex;align-items:center;justify-content:center;width:clamp(19px,5vmin,44px);height:clamp(19px,5vmin,44px);border-radius:5px;color:#fff;font-size:clamp(11px,2.6vmin,22px);font-weight:700}
#hint{margin:auto;color:#7d8872;font-size:13px;text-align:center}
#result{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:10px;box-sizing:border-box;background:#f4efdc;text-align:center}
#result.on{display:flex}
#swatch{width:clamp(70px,34vmin,260px);height:clamp(70px,34vmin,260px);border-radius:50%;border:3px solid #fffdf3;box-shadow:0 2px 9px rgb(45 60 40 / 35%)}
#label{font-size:clamp(13px,3.2vmin,24px);font-weight:700}
small{color:#5b6058;font-size:clamp(10px,2.2vmin,15px)}
</style></head><body>
<div id="w">
  <div id="bases">
    <button class="b A" data-b="A" aria-label="Add A">A</button>
    <button class="b T" data-b="T" aria-label="Add T">T</button>
    <button class="b G" data-b="G" aria-label="Add G">G</button>
    <button class="b C" data-b="C" aria-label="Add C">C</button>
    <button id="undo">Undo</button>
    <button id="clear">Clear</button>
    <button id="done" disabled>Finish</button>
  </div>
  <div id="strand" aria-live="polite"><div id="hint">Add at least 6 blocks to build a DNA strand</div></div>
  <div id="result" role="status">
    <div id="swatch"></div>
    <div id="label"></div>
    <small>Just a game. Real skin color comes from many genes working together.</small>
    <button id="again">Build another</button>
  </div>
</div>
<script>
var strand=[],MIN=6,MAX=40,el=document.getElementById('strand'),hint=document.getElementById('hint'),done=document.getElementById('done'),result=document.getElementById('result');
var BASE={A:.14,T:.36,G:.68,C:.94};
var TONES=[[248,224,202],[229,186,150],[192,139,102],[138,90,60],[92,58,38],[58,36,24]];
function draw(){
  el.textContent='';
  if(!strand.length)el.appendChild(hint);
  strand.forEach(function(b){var t=document.createElement('div');t.className='t '+b;t.textContent=b;el.appendChild(t)});
  el.scrollTop=el.scrollHeight;
  done.disabled=strand.length<MIN;
}
function level(){
  var sum=0,turn=0;
  strand.forEach(function(b,i){sum+=BASE[b];turn+=BASE[b]*Math.sin(i*1.7)});
  return Math.max(0,Math.min(1,sum/strand.length+turn/strand.length*.22));
}
function tone(p){
  var at=p*(TONES.length-1),i=Math.min(TONES.length-2,Math.floor(at)),f=at-i;
  return 'rgb('+TONES[i].map(function(v,c){return Math.round(v+(TONES[i+1][c]-v)*f)}).join(',')+')';
}
document.querySelectorAll('.b').forEach(function(b){b.onclick=function(){if(strand.length<MAX){strand.push(b.dataset.b);draw()}}});
document.getElementById('undo').onclick=function(){strand.pop();draw()};
document.getElementById('clear').onclick=function(){strand=[];draw()};
done.onclick=function(){
  var p=level();
  document.getElementById('swatch').style.background=tone(p);
  document.getElementById('label').textContent='Your strand made this shade. Melanin level: '+Math.round(p*100)+'%';
  result.classList.add('on');
  document.getElementById('again').focus();
};
document.getElementById('again').onclick=function(){result.classList.remove('on');strand=[];draw()};
</script>
</body></html>
