<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Minesweeper</title>
<style>
html,body{margin:0;height:100%;background:#f4efdf;color:#2f4a2a;font-family:system-ui,sans-serif}
body{display:flex;flex-direction:column;gap:.3rem;padding:.4rem;box-sizing:border-box}
.bar{display:flex;gap:.5rem;align-items:center;font-size:.8rem;flex-wrap:wrap}
button.r,button.m{background:#5d7a45;color:#f4efdf;border:0;border-radius:6px;padding:.25rem .6rem;font-weight:700;cursor:pointer}
#g{flex:1;min-height:0;display:grid;gap:2px;aspect-ratio:1;max-width:100%;align-self:center;grid-template-columns:repeat(9,1fr);grid-template-rows:repeat(9,1fr)}
#g button{padding:0;border:0;border-radius:3px;background:#8aa66b;color:#2f4a2a;font-weight:800;font-size:clamp(.6rem,3.5vmin,1.2rem);cursor:pointer;touch-action:manipulation}
#g button.o{background:#e9e2c8;cursor:default}
#g button.x{background:#b05a4a;color:#fff}
button:focus-visible{outline:2px solid #2f4a2a}
</style></head><body>
<div class="bar"><button class="r" id="rs" type="button">New game</button><button class="m" id="fl" type="button" aria-pressed="false">Flag mode: off</button><span id="s">Mines: 10</span></div>
<div id="g" role="grid" aria-label="Minesweeper board"></div>
<script>
var N=9,M=10,g=document.getElementById('g'),s=document.getElementById('s'),fm=false,cells,over,first,left;
function nb(i,f){var r=i/N|0,c=i%N;for(var a=-1;a<2;a++)for(var b=-1;b<2;b++){var rr=r+a,cc=c+b;if((a||b)&&rr>=0&&rr<N&&cc>=0&&cc<N)f(rr*N+cc)}}
function init(){g.innerHTML='';cells=[];over=false;first=true;left=N*N-M;s.textContent='Mines: '+M;
 for(var i=0;i<N*N;i++){var b=document.createElement('button');b.type='button';b.setAttribute('aria-label','cell');(function(i){
  b.onclick=function(){click(i)};b.oncontextmenu=function(e){e.preventDefault();flag(i)}})(i);
  g.appendChild(b);cells.push({b:b,m:false,n:0,o:false,f:false})}}
function place(a){var k=0;while(k<M){var i=Math.random()*N*N|0;if(i==a||cells[i].m)continue;var near=false;nb(a,function(j){if(j==i)near=true});if(near)continue;cells[i].m=true;k++}
 cells.forEach(function(c,i){nb(i,function(j){if(cells[j].m)c.n++})})}
function flag(i){var c=cells[i];if(over||c.o)return;c.f=!c.f;c.b.textContent=c.f?'⚑':''}
function open(i){var c=cells[i];if(c.o||c.f)return;c.o=true;left--;c.b.className='o';c.b.textContent=c.n||'';if(!c.n)nb(i,open)}
function click(i){if(over)return;if(fm){flag(i);return}var c=cells[i];if(c.f||c.o)return;if(first){place(i);first=false}
 if(c.m){over=true;cells.forEach(function(d){if(d.m){d.b.className='x';d.b.textContent='✱'}});s.textContent='Boom! Try again.';return}
 open(i);if(left==0){over=true;s.textContent='You win!'}}
document.getElementById('rs').onclick=init;
document.getElementById('fl').onclick=function(){fm=!fm;this.textContent='Flag mode: '+(fm?'on':'off');this.setAttribute('aria-pressed',fm)};
init();
</script></body></html>
