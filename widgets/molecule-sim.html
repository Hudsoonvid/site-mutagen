<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
html,body{margin:0;height:100%;background:#f4efdc;font-family:system-ui,sans-serif;color:#2f4a2a;overflow:hidden}
#w{display:flex;flex-direction:column;height:100%}
#bar{display:flex;gap:4px;padding:4px;flex-wrap:wrap;align-items:center}
button{background:#5b7a3a;color:#f4efdc;border:0;border-radius:6px;padding:4px 7px;font-size:12px;cursor:pointer;min-height:26px}
button.on{background:#2f4a2a}
#c{flex:1;min-height:0;width:100%;touch-action:none;display:block}
#info{font-size:11px;padding:2px 6px 4px;min-height:14px}
</style></head><body><div id="w">
<div id="bar"></div><canvas id="c"></canvas><div id="info"></div></div>
<script>
const MOLS={
"Water H2O":{atoms:[["O",0,0,0],["H",.76,.59,0],["H",-.76,.59,0]],bonds:[[0,1],[0,2]],note:"Two hydrogens bond to one oxygen at about 104.5 degrees."},
"Oxygen O2":{atoms:[["O",-.6,0,0],["O",.6,0,0]],bonds:[[0,1,2]],note:"Two oxygen atoms share a double bond."},
"Hydrogen H2":{atoms:[["H",-.37,0,0],["H",.37,0,0]],bonds:[[0,1]],note:"The smallest molecule: two hydrogens."},
"Carbon dioxide CO2":{atoms:[["C",0,0,0],["O",-1.16,0,0],["O",1.16,0,0]],bonds:[[0,1,2],[0,2,2]],note:"Linear, with two double bonds."},
"Methane CH4":{atoms:[["C",0,0,0],["H",.63,.63,.63],["H",-.63,-.63,.63],["H",-.63,.63,-.63],["H",.63,-.63,-.63]],bonds:[[0,1],[0,2],[0,3],[0,4]],note:"Four hydrogens form a tetrahedron around carbon."},
"Ammonia NH3":{atoms:[["N",0,.2,0],["H",.94,-.15,0],["H",-.47,-.15,.81],["H",-.47,-.15,-.81]],bonds:[[0,1],[0,2],[0,3]],note:"Nitrogen with three hydrogens, shaped like a pyramid."}
};
const COL={H:"#f4efdc",O:"#c0392b",C:"#444",N:"#3b6fb6"},RAD={H:.28,O:.45,C:.5,N:.47};
const cv=document.getElementById("c"),g=cv.getContext("2d"),bar=document.getElementById("bar"),info=document.getElementById("info");
let cur=null,mixed=false,ax=.4,ay=.6,drag=null,items=[];
function fit(){const r=cv.getBoundingClientRect(),d=devicePixelRatio||1;cv.width=r.width*d;cv.height=r.height*d}
addEventListener("resize",fit);
function btn(t,f){const b=document.createElement("button");b.textContent=t;b.onclick=()=>{f();[...bar.children].forEach(x=>x.classList.remove("on"));b.classList.add("on")};bar.appendChild(b);return b}
function show(n){mixed=false;cur=n;const m=MOLS[n];items=[{id:0,m,p:[0,0,0],v:[0,0,0]}];info.textContent=m.note}
function mix(){mixed=true;cur=null;items=[];const k=Object.keys(MOLS);for(let i=0;i<10;i++){const m=MOLS[k[i%k.length]];items.push({id:i,m,p:[Math.random()*6-3,Math.random()*4-2,Math.random()*4-2],v:[(Math.random()-.5)*.02,(Math.random()-.5)*.02,(Math.random()-.5)*.02]})}info.textContent="Molecules drifting and tumbling in a mix. Drag to rotate."}
Object.keys(MOLS).forEach(n=>btn(n,()=>show(n)));
btn("Mix them",mix);
bar.children[0].click();
cv.onpointerdown=e=>{drag=[e.clientX,e.clientY];cv.setPointerCapture(e.pointerId)};
cv.onpointerup=()=>drag=null;
cv.onpointermove=e=>{if(!drag)return;ay+=(e.clientX-drag[0])*.01;ax+=(e.clientY-drag[1])*.01;drag=[e.clientX,e.clientY]};
function rot(p,a,b){let[x,y,z]=p;let c=Math.cos(b),s=Math.sin(b);[x,z]=[x*c+z*s,-x*s+z*c];c=Math.cos(a);s=Math.sin(a);[y,z]=[y*c-z*s,y*s+z*c];return[x,y,z]}
function frame(t){
fit();const W=cv.width,H=cv.height,S=Math.min(W,H)/(mixed?8:4.2);
g.clearRect(0,0,W,H);
if(!drag)ay+=.006;
const list=[];
items.forEach((it,i)=>{
if(mixed){for(let k=0;k<3;k++){it.p[k]+=it.v[k];const lim=k==0?3.2:2.2;if(Math.abs(it.p[k])>lim)it.v[k]*=-1}}
const sp=t/1000*(.6+i*.13);
it.m.atoms.forEach((a,j)=>{
let q=rot([a[1],a[2],a[3]],sp*.5,sp);q=[q[0]+it.p[0],q[1]+it.p[1],q[2]+it.p[2]];
q=rot(q,ax,ay);const f=6/(6+q[2]);
list.push({x:W/2+q[0]*S*f,y:H/2+q[1]*S*f,z:q[2],r:RAD[a[0]]*S*f*(mixed?.9:1),e:a[0],it,j,q,f})});
});
const pos=new Map();list.forEach(a=>pos.set(a.it.id+"|"+a.j,a));
const draw=[];
list.forEach(a=>draw.push({z:a.z,fn:()=>{const gr=g.createRadialGradient(a.x-a.r*.3,a.y-a.r*.3,a.r*.1,a.x,a.y,a.r);gr.addColorStop(0,"#fff");gr.addColorStop(.25,COL[a.e]);gr.addColorStop(1,"#1d2b1a");g.fillStyle=gr;g.beginPath();g.arc(a.x,a.y,a.r,0,7);g.fill()}}));
items.forEach(it=>it.m.bonds.forEach(b=>{const A=pos.get(it.id+"|"+b[0]),B=pos.get(it.id+"|"+b[1]);if(!A||!B)return;
draw.push({z:(A.z+B.z)/2,fn:()=>{g.strokeStyle="#8a9a7a";g.lineCap="round";const n=b[2]||1,dx=B.y-A.y,dy=A.x-B.x,l=Math.hypot(dx,dy)||1;for(let k=0;k<n;k++){const o=(k-(n-1)/2)*S*.1*A.f;g.lineWidth=Math.max(2,S*.09*A.f);g.beginPath();g.moveTo(A.x+dx/l*o,A.y+dy/l*o);g.lineTo(B.x+dx/l*o,B.y+dy/l*o);g.stroke()}}})}));
draw.sort((a,b)=>b.z-a.z).forEach(d=>d.fn());
requestAnimationFrame(frame)}
requestAnimationFrame(frame);
</script></body></html>
